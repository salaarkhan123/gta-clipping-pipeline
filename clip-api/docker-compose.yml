services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: clip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: clip
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clip -d clip"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://clip:${POSTGRES_PASSWORD}@db:5432/clip
      DATA_DIR: /srv/data
    volumes:
      - data:/srv/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://clip:${POSTGRES_PASSWORD}@db:5432/clip
      DATA_DIR: /srv/data
    volumes:
      - data:/srv/data
    depends_on:
      api:
        condition: service_healthy   # api creates the tables first

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      WEB_DOMAIN: ${WEB_DOMAIN:?set WEB_DOMAIN in .env}
      MEDIA_ORIGIN: ${S3_ENDPOINT_URL:-}     # the bucket host the site's CSP allows (Caddyfile)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # ---------------------------------------------------------------------------
  # Optional dedicated render worker (SPEC setup B / S4). FULLY COMMENTED —
  # default `docker compose up` is unchanged. Owner provisions the host; agents
  # must not enable paid cloud GPUs. See docs/render-worker.md and DEPLOY.md.
  #
  # Until S4 (#98) WORKER_STAGES ships, this is the same full pipeline as
  # `worker` (useful only as a second replica on a larger host with shared
  # storage). After S4, set render-only stages on this service.
  #
  # render-worker:
  #   build: .
  #   restart: unless-stopped
  #   command: ["python", "-m", "app.worker"]
  #   env_file: .env
  #   environment:
  #     DATABASE_URL: postgresql+psycopg://clip:${POSTGRES_PASSWORD}@db:5432/clip
  #     DATA_DIR: /srv/data
  #     # On a 16-vCPU host, try RENDER_WORKERS=4 (or higher) only after
  #     # scripts/job_timings.py; leave WORKER_CONCURRENCY at 1 until measured.
  #     # RENDER_WORKERS: "4"
  #     # WORKER_CONCURRENCY: "1"
  #   volumes:
  #     - data:/srv/data
  #   depends_on:
  #     api:
  #       condition: service_healthy
  # ---------------------------------------------------------------------------

volumes:
  pgdata:
  data:
  caddy_data:
  caddy_config:
