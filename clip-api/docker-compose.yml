services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: clip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: clip
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clip -d clip"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://clip:${POSTGRES_PASSWORD}@db:5432/clip
      DATA_DIR: /srv/data
    volumes:
      - data:/srv/data
    # SEC-010 / SEC-003: drop privileges; API must not be published (only Caddy reaches it).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://clip:${POSTGRES_PASSWORD}@db:5432/clip
      DATA_DIR: /srv/data
      # SEC-005: worker parses untrusted media — do not give it billing webhook secrets.
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      RESEND_API_KEY: ""
      SMTP_PASSWORD: ""
    volumes:
      - data:/srv/data
    # SEC-005 / SEC-010: untrusted yt-dlp/ffmpeg stay non-root, no new privileges, capped resources.
    # Residual: still shares the `data` volume and DB role with the API; full sandbox (gVisor/Firecracker)
    # needs infra beyond this compose file.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 6g
    cpus: 3.0
    depends_on:
      api:
        condition: service_healthy   # api creates the tables first

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      WEB_DOMAIN: ${WEB_DOMAIN:?set WEB_DOMAIN in .env}
      MEDIA_ORIGIN: ${S3_ENDPOINT_URL:-}     # the bucket host the site's CSP allows (Caddyfile)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  data:
  caddy_data:
  caddy_config:
